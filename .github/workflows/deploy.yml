name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main, dev]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - name: Inject Mapbox token
        run: sed -i 's/__MAPBOX_TOKEN__/${{ secrets.MAPBOX_TOKEN }}/g' app.js

      - name: Inject OS token
        run: sed -i 's/__OS_TOKEN__/${{ secrets.OS_TOKEN }}/g' app.js

      # The fuel lookup's server URL and key live in repo secrets and are copied into the
      # Pages project's Preview environment, so it is only switched on for dev.
      # Skipped until FUEL_MCP_TOKEN is set. Production stays off. The null entries
      # remove the old chat's settings.
      - name: Configure fuel prices (Preview)
        if: github.ref_name == 'dev'
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          FUEL_MCP_URL: ${{ secrets.FUEL_MCP_URL }}
          FUEL_MCP_TOKEN: ${{ secrets.FUEL_MCP_TOKEN }}
        run: |
          if [ -z "$FUEL_MCP_TOKEN" ]; then echo "Fuel secrets not set; skipping"; exit 0; fi
          jq -n '{deployment_configs: {preview: {env_vars: {
            FUEL_ENABLED: {type: "plain_text", value: "true"},
            FUEL_MCP_URL: {type: "plain_text", value: env.FUEL_MCP_URL},
            FUEL_MCP_TOKEN: {type: "secret_text", value: env.FUEL_MCP_TOKEN},
            CHAT_ENABLED: null,
            ANTHROPIC_API_KEY: null
          }}}}' > body.json
          curl -sf -X PATCH -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" \
            --data @body.json \
            "https://api.cloudflare.com/client/v4/accounts/a30a1eec7f8eb1e19439a3bc00d47beb/pages/projects/ldnmap" \
            | jq '{success, errors}'
          rm body.json

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: a30a1eec7f8eb1e19439a3bc00d47beb
          command: pages deploy . --project-name=ldnmap --branch=${{ github.ref_name }}
