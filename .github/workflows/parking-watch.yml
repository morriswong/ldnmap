name: Parking data watch

# Weekly: look for council parking changes the map may be missing (MyRingGo tariff updates, new
# traffic orders in the DfT's D-TRO service, parking notices on council websites, the bank holiday
# list running out) and open an issue for each. It never changes the data. See
# tools/check_parking_sources.py, tools/dtro.py and tools/council_notices.py.
# D-TRO needs the repository secrets DTRO_CLIENT_ID and DTRO_CLIENT_SECRET (a free consumer
# application from https://dtro-ui.dft.gov.uk); without them that check is skipped.
on:
  schedule:
    - cron: '0 6 * * 1'   # Mondays 06:00 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Print findings only, open no issues'
        type: boolean
        default: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4

      - name: Check council sources
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DTRO_CLIENT_ID: ${{ secrets.DTRO_CLIENT_ID }}
          DTRO_CLIENT_SECRET: ${{ secrets.DTRO_CLIENT_SECRET }}
        run: python3 tools/check_parking_sources.py ${{ inputs.dry_run && '--dry-run' || '' }}
